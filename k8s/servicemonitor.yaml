apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: blogapp-backend
  namespace: blogapp
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app: blogapp-backend
  namespaceSelector:
    matchNames:
      - blogapp
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
